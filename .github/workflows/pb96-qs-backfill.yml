name: "One-time PB96 historical QS audit"
on:
  push:
    paths:
      - ".github/workflows/pb96-qs-backfill.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Scrape and audit 2015-2025 season QS/HQS from NF3
        run: python tools/pb96_qs_backfill.py --delay 0.7
      - name: Commit validated changes and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pb96/data/npb_extended.json pb96/data/npb_supplement.json pb96/data/npb_qs_import_audit.json
          git diff --cached --quiet || (git commit -m "Backfill NF3-verified PB96 QS and HQS, preserve conflicts" && git push)
