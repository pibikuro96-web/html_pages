name: "One-time PB96 2026 HQS completion"
on:
  push:
    paths:
      - ".github/workflows/pb96-hqs-2026.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Compare 2026 NF3 HQS records to NPB-backed season data
        run: python tools/pb96_hqs_2026.py
      - name: Commit confirmed HQS values and source audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pb96/data/npb_supplement.json pb96/data/npb_hqs_2026_audit.json
          git diff --cached --quiet || (git commit -m "Complete verified 2026 HQS records and retain source audit" && git push)
