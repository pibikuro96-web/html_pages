name: "NPB supplementary one-time import"
on:
  push:
    branches: [main]
    paths:
      - "tools/npb_profile_import.py"
      - ".github/workflows/npb-profile-import.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup parser
        run: python -m pip install beautifulsoup4
      - name: Import and verify NPB official rows
        run: python tools/npb_profile_import.py --only 018,064,074 --delay 2.0
      - name: Commit verified data and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pb96/data/npb_supplement.json pb96/data/npb_import_audit.json
          git diff --cached --quiet || (git commit -m "Import verified NPB official supplementary stats" && git push)
